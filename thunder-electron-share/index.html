<!doctype html>
<meta charset="utf-8">
<title>迅雷网盘上传工具</title>
<style>
:root{font-family:"Microsoft YaHei",Arial,sans-serif;color:#172033;background:#eef3f8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column;min-width:900px}
.header{height:64px;flex:none;background:linear-gradient(135deg,#1677ff,#0b5bd3);color:#fff;display:flex;align-items:center;padding:0 22px;justify-content:space-between}.brand{font-size:22px;font-weight:bold;letter-spacing:1px}.brand small{font-size:12px;font-weight:normal;opacity:.8;margin-left:8px}.account{font-size:13px;opacity:.92}
.login{height:282px;flex:none;margin:14px 18px 0;background:#fff;border:1px solid #d9e2ee;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px #1b4c7a14;position:relative}.login.collapsed{height:54px}.login.collapsed .web{position:absolute;left:-10000px;top:-10000px;width:1px;height:1px}.login.collapsed .login-note{color:#12804c;background:#e7f7ee}.web{width:100%;height:100%;border:0;display:block}.login-note{position:absolute;left:14px;top:12px;padding:7px 11px;border-radius:7px;background:#fffffff0;color:#4e5d73;font-size:13px;z-index:2}.login-actions{position:absolute;right:12px;top:10px;z-index:2;display:flex;gap:6px}.login-actions button,.tool button{font-size:12px;padding:6px 11px}
.panel{margin:14px 18px 0;background:#fff;border:1px solid #d9e2ee;border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px #1b4c7a14}.row{display:flex;align-items:center;gap:8px;margin:7px 0}.field-label{width:102px;text-align:right;color:#526078;font-size:14px}.input{height:34px;border:1px solid #c9d4e2;border-radius:7px;padding:6px 10px;outline:none;background:#fbfdff}.input:focus{border-color:#287eff;box-shadow:0 0 0 3px #287eff1a}#parent{width:390px}#file{flex:1;min-width:300px}.btn{height:34px;padding:0 15px;border:0;border-radius:7px;cursor:pointer;font-size:14px;background:#edf2f8;color:#26364e}.btn:hover{filter:brightness(.97)}.primary{background:#176ff2;color:#fff}.success{background:#0ca678;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}progress{height:18px;width:190px}.result{display:flex;align-items:center;gap:8px;margin-top:8px}.result input{flex:1}.status{margin-left:110px;color:#2671d8;font-size:13px;height:19px}.log{flex:1;min-height:92px;margin-top:14px;background:#101a29;color:#a8f5ae;padding:10px 14px;overflow:auto;white-space:pre-wrap;font:13px Consolas,"Microsoft YaHei",monospace}
</style>
<div class="header"><div class="brand">迅雷网盘 <small>自动上传与永久分享</small></div><div class="account" id="account">未同步登录令牌</div></div>
<div class="login" id="login"><webview class="web" id="web" src="https://pan.xunlei.com" allowpopups></webview><div class="login-note" id="note">请在这里扫码登录迅雷网盘</div><div class="login-actions"><button class="btn" id="sync">同步登录令牌</button><button class="btn" id="toggle">收起网页登录</button><button class="btn" id="refresh">刷新网页</button></div></div>
<div class="panel">
  <div class="row"><div class="field-label">目标文件夹 ID</div><input class="input" id="parent" placeholder="根目录可留空"><button class="btn primary" id="up">开始上传</button><button class="btn success" id="share" disabled>生成永久链接</button><progress id="p" value="0" max="100"></progress></div>
  <div class="row"><div class="field-label">本地文件</div><input class="input" id="file" readonly placeholder="请选择要上传的文件"><button class="btn" id="choose">选择文件</button></div>
  <div class="result"><div class="field-label">分享结果</div><input class="input" id="link" readonly placeholder="上传成功后自动显示永久分享链接"></div>
  <div class="status" id="status">状态：请扫码登录，然后点击“同步登录令牌”</div>
</div>
<div class="log" id="log"></div>
<script>
const $=id=>document.getElementById(id),web=$('web');let uploadedName='',zoom=1.15;
async function syncAuth(){try{const a=await web.executeJavaScript(`(()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),v=localStorage.getItem(k)||'';if(k.startsWith('credentials')){try{const j=JSON.parse(v);if(j.access_token){o.authorization=(j.token_type||'Bearer')+' '+j.access_token;o.client=k.substring(k.indexOf('_')+1)}}catch{}}if(k.startsWith('captcha')){try{const j=JSON.parse(v);if(j.token)o.captcha=j.token}catch{}}if(k==='deviceid'){o.device=v.includes('.')?v.split('.').pop().slice(0,32):v}}return o})()`);if(!a||!a.authorization||!a.device){$('status').textContent='状态：尚未读取到网页登录令牌';return false}await api.setAuth(a);$('login').classList.add('collapsed');$('note').textContent='已登录迅雷网盘，网页登录区已收起';$('account').textContent='已同步登录令牌';$('status').textContent='状态：登录成功，可以选择文件上传';return true}catch(e){$('status').textContent='状态：同步失败，请刷新网页后重试';return false}}
$('sync').onclick=syncAuth;$('toggle').onclick=()=>{$('login').classList.toggle('collapsed');$('toggle').textContent=$('login').classList.contains('collapsed')?'展开网页登录':'收起网页登录'};$('refresh').onclick=()=>{web.reload();$('login').classList.remove('collapsed');$('note').textContent='请在这里扫码登录迅雷网盘';$('status').textContent='状态：正在刷新网页登录页…'};web.addEventListener('dom-ready',()=>web.setZoomFactor(zoom));
$('choose').onclick=async()=>{const f=await api.chooseFile();if(f){$('file').value=f;uploadedName=f.split(/[\\/]/).pop();$('status').textContent='状态：已选择 '+uploadedName}};
async function generateShare(){try{$('status').textContent='状态：上传成功，正在生成永久链接…';for(let i=0;i<4;i++){const r=await web.executeJavaScript(`(()=>{const n=${JSON.stringify(uploadedName)},a=[...document.querySelectorAll('button,[role=button],a,div,span')],x=a.find(e=>(e.innerText||'').trim().includes(n));if(x){x.click();return 1}return 0})()`);if(r)break;await new Promise(r=>setTimeout(r,800))}await new Promise(r=>setTimeout(r,700));for(const words of [['分享','创建分享'],['永久有效','永久','长期有效'],['创建分享链接','生成链接','确定','确认']]){await web.executeJavaScript(`(()=>{const a=[...document.querySelectorAll('button,[role=button],a,div,span')],x=a.find(e=>${JSON.stringify(words)}.some(w=>(e.innerText||'').trim()===w));if(x)x.click()})()`);await new Promise(r=>setTimeout(r,700))}const v=await web.executeJavaScript(`(()=>{const t=document.body.innerText||'',u=t.match(/https?:\\/\\/[^\\s]+/),p=t.match(/(?:提取码|密码)\\s*[:：]?\\s*([A-Za-z0-9]{4,6})/);return(u?u[0]:'')+(p?'?pwd='+p[1]:'')})()`);$('link').value=v||'上传成功，请点击“生成永久链接”重试';$('status').textContent=v?'状态：永久分享链接已生成':'状态：上传成功，未识别到链接'}catch(e){$('status').textContent='状态：生成链接失败，请点击绿色按钮重试';$('link').value='生成失败：'+e.message}}
$('up').onclick=async()=>{try{if(!$('file').value)return alert('请选择文件');if(!await syncAuth())return;$('status').textContent='状态：正在上传…';$('link').value='';$('p').value=0;await api.upload({file:$('file').value,parent:$('parent').value});$('share').disabled=false;await generateShare()}catch(e){const m=e.message||'';if(m.includes('captcha_invalid')){$('status').textContent='状态：验证码已失效，请刷新网页重新登录';$('link').value='验证码无效，请刷新网页后重新同步令牌'}else{$('status').textContent='状态：上传失败';$('link').value=m}alert($('link').value)}};
$('share').onclick=generateShare;api.onLog(m=>{$('log').textContent+=m+'\n';$('log').scrollTop=$('log').scrollHeight});api.onProgress(x=>{$('p').value=x.total?x.done*100/x.total:0});api.onAuthReady(()=>{});
</script>
