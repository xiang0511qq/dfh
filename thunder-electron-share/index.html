<!doctype html><meta charset="utf-8"><title>迅雷网盘自动上传工具</title><style>body{margin:0;font-family:Microsoft YaHei}#top{height:520px;display:block;overflow:hidden};border-bottom:1px solid #aaa}#bar{padding:10px;background:#f5f5f5}input{width:500px;padding:6px;margin:3px}button{padding:7px 15px;margin:4px}.log{height:170px;overflow:auto;background:#111;color:#0f0;padding:8px;white-space:pre-wrap}.linkbox{padding:8px;background:#fff3cd}#link{width:900px}#web{display:block;width:100%;height:100%;border:0}</style><div id="top"><webview id="web" src="https://pan.xunlei.com" allowpopups></webview></div><div id="bar">目标文件夹 ID <input id="parent" placeholder="根目录可留空"><br>本地文件 <input id="file" readonly><button id="choose">选择文件</button><button id="up">开始自动上传</button><button id="share" disabled>生成永久分享链接</button><progress id="p" value="0" max="100" style="width:320px"></progress><div class="linkbox">分享结果 <input id="link" readonly></div></div><div class="log" id="log"></div><script>const $=id=>document.getElementById(id);let uploadedName='';$('choose').onclick=async()=>{let f=await api.chooseFile();if(f){$('file').value=f;uploadedName=f.split(/[\\/]/).pop()}};$('up').onclick=async()=>{try{if(!$('file').value)return alert('请选择文件');await api.upload({file:$('file').value,parent:$('parent').value});$('share').disabled=false;alert('上传完成')}catch(e){alert(e.message)}};$('share').onclick=async()=>{try{const w=$('web');let r=await w.executeJavaScript(`(()=>{const n=${JSON.stringify(uploadedName)},v=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!='none'},t=e=>(e.innerText||'').trim(),a=[...document.querySelectorAll('button,[role=button],a,div,span')],x=a.find(e=>v(e)&&t(e).includes(n));if(x){x.click();return 'ok'}return '未找到文件'})()`);if(r!='ok'){$('link').value=r;return}await new Promise(x=>setTimeout(x,700));for(const words of [['分享','创建分享'],['永久有效','永久','长期有效'],['创建分享链接','生成链接','确定','确认']]){await w.executeJavaScript(`(()=>{const a=[...document.querySelectorAll('button,[role=button],a,div,span')],x=a.find(e=>${JSON.stringify(words)}.some(w=>(e.innerText||'').trim()===w));if(x)x.click();return true})()`);await new Promise(x=>setTimeout(x,700))}$('link').value=await w.executeJavaScript(`(()=>{const t=document.body.innerText||'',u=t.match(/https?:\\/\\/[^\\s]+/),p=t.match(/(?:提取码|密码)\\s*[:：]?\\s*([A-Za-z0-9]{4,6})/);return (u?u[0]:'未识别链接')+(p?'?pwd='+p[1]:'')})()`)}catch(e){$('link').value='生成失败: '+e.message}};api.onLog(m=>{$('log').textContent+=m+'\\n'});api.onProgress(x=>{$('p').value=x.done*100/x.total});</script>
