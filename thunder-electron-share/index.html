<!doctype html>
<meta charset="utf-8">
<title>迅雷网盘上传工具</title>
<style>
:root{font-family:"Microsoft YaHei",Arial,sans-serif;color:#172033;background:#eef3f8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column;min-width:900px}
.header{height:70px;flex:none;background:linear-gradient(135deg,#176ff2,#0b5bd3);color:#fff;display:flex;align-items:center;padding:0 28px;justify-content:space-between}.brand{font-size:25px;font-weight:bold;letter-spacing:1px}.brand small{font-size:13px;font-weight:normal;opacity:.85;margin-left:10px}.account{font-size:14px}
.card{margin:16px 22px 0;background:#fff;border:1px solid #d9e2ee;border-radius:14px;box-shadow:0 5px 18px #1b4c7a14;padding:18px 22px}.login-card{height:126px;flex:none;display:flex;align-items:center;justify-content:space-between}.login-info h3{margin:0 0 8px;font-size:19px;color:#1c3554}.login-info p{margin:0;color:#63728a;font-size:14px}.login-actions{display:flex;gap:10px}.panel{flex:none;padding:16px 22px}.row{display:flex;align-items:center;gap:9px;margin:9px 0}.field-label{width:112px;text-align:right;color:#526078;font-size:14px}.input{height:36px;border:1px solid #c9d4e2;border-radius:8px;padding:6px 11px;outline:none;background:#fbfdff;font-size:14px}.input:focus{border-color:#287eff;box-shadow:0 0 0 3px #287eff1a}#parent{width:430px}#file{flex:1;min-width:300px}.btn{height:36px;padding:0 17px;border:0;border-radius:8px;cursor:pointer;font-size:14px;background:#edf2f8;color:#26364e}.btn:hover{filter:brightness(.97)}.primary{background:#176ff2;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}progress{height:18px;width:260px}.status{margin-left:121px;color:#2671d8;font-size:13px;height:20px}.log{flex:1;min-height:160px;margin:16px 22px 22px;background:#101a29;color:#a8f5ae;padding:14px 16px;overflow:auto;white-space:pre-wrap;border-radius:14px;font:14px Consolas,"Microsoft YaHei",monospace}
</style>
<div class="header"><div class="brand">迅雷网盘 <small>自动上传与永久分享</small></div><div class="account" id="account">未登录</div></div>
<div class="card login-card"><div class="login-info"><h3>网盘登录</h3><p id="loginText">点击右侧按钮打开独立扫码窗口，二维码不会被主界面遮挡</p></div><div class="login-actions"><button class="btn primary" id="openLogin">打开扫码登录</button><button class="btn" id="sync">同步登录令牌</button></div></div>
<div class="card panel">
  <div class="row"><div class="field-label">目标文件夹 ID</div><input class="input" id="parent" placeholder="根目录可留空"><button class="btn primary" id="up">开始上传</button><progress id="p" value="0" max="100"></progress></div>
  <div class="row"><div class="field-label">本地文件</div><input class="input" id="file" readonly placeholder="请选择要上传的文件"><button class="btn" id="choose">选择文件</button></div>
  <div class="status" id="status">状态：请先扫码登录，再同步登录令牌</div>
</div>
<div class="log" id="log"></div>
<script>
const $=id=>document.getElementById(id);let uploadedName='';
function writeLog(m){$('log').textContent+=m+'\n';$('log').scrollTop=$('log').scrollHeight}
async function syncAuth(){try{const a=await api.getAuth();if(!a||!a.authorization||!a.device){$('status').textContent='状态：尚未读取到令牌，请先扫码登录';writeLog('尚未读取到令牌，请在扫码窗口完成登录');return false}await api.setAuth(a);$('account').textContent='已登录';$('loginText').textContent='已捕获网页令牌，可以上传文件';$('status').textContent='状态：登录成功，可以选择文件';writeLog('网页登录令牌已同步');return true}catch(e){$('status').textContent='状态：令牌同步失败';writeLog('令牌同步失败：'+e.message);return false}}
$('openLogin').onclick=async()=>{await api.openLogin();$('loginText').textContent='扫码窗口已打开，请完成登录后点击同步';writeLog('已打开独立扫码登录窗口')};$('sync').onclick=syncAuth;
$('choose').onclick=async()=>{const f=await api.chooseFile();if(f){$('file').value=f;uploadedName=f.split(/[\\/]/).pop();$('status').textContent='状态：已选择 '+uploadedName;writeLog('已选择文件：'+uploadedName)}};
$('up').onclick=async()=>{try{if(!$('file').value)return alert('请选择文件');if(!await syncAuth())return;$('status').textContent='状态：正在上传…';$('p').value=0;await api.upload({file:$('file').value,parent:$('parent').value});writeLog('上传成功，正在自动生成永久分享链接');$('status').textContent='状态：上传成功，正在生成永久链接…';const v=await api.generateShare(uploadedName);if(v){writeLog('永久分享链接：'+v);$('status').textContent='状态：永久分享链接已写入日志'}else{writeLog('上传成功，但暂未识别到分享链接，请在扫码窗口查看文件');$('status').textContent='状态：上传成功，未识别到分享链接'}}catch(e){const m=e.message||'';if(m.includes('captcha_invalid')){writeLog('验证码无效，请在扫码窗口刷新页面后重新同步令牌');$('status').textContent='状态：验证码已失效'}else{writeLog('上传失败：'+m);$('status').textContent='状态：上传失败'}}};
api.onLog(writeLog);api.onProgress(x=>{$('p').value=x.total?x.done*100/x.total:0});api.onAuthReady(()=>{syncAuth()});
</script>
