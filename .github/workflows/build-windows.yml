name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "二维码生成工具" qr_generator.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 二维码生成工具-Windows
          path: dist/二维码生成工具.exe
