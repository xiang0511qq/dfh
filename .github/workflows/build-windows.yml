name: Build NetdiskUploader EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build NetdiskUploader EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "NetdiskUploader" netdisk_uploader.py
      - name: Upload NetdiskUploader EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetdiskUploader-EXE
          path: dist/NetdiskUploader.exe
