name: Build Baidu direct uploader EXE
on:
  push:
    paths:
      - 'baidu_direct_uploader.py'
      - '.github/workflows/build-baidu-direct.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name 百度网盘直传工具 baidu_direct_uploader.py
      - uses: actions/upload-artifact@v4
        with:
          name: 百度网盘直传工具-Windows
          path: dist/百度网盘直传工具.exe
