name: Build Baidu compact EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'baidu-link-compact/**'
      - '.github/workflows/build-baidu-link-compact.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: baidu-link-compact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "百度网盘链接精简版" baidu_compact.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 百度网盘链接精简版
          path: baidu-link-compact/dist/百度网盘链接精简版.exe
