name: build-xunlei-uploader-v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'xunlei_uploader_v3.py'
      - '.github/workflows/build-xunlei-uploader-v3.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 pyinstaller
      - run: pyinstaller --noconsole --onefile --name 迅雷网盘自动上传工具 xunlei_uploader_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: 迅雷网盘自动上传工具-验证码版
          path: dist/迅雷网盘自动上传工具.exe
