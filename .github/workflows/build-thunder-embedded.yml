name: build-thunder-embedded
on:
  workflow_dispatch:
  push:
    paths:
      - 'thunder-electron/**'
      - '.github/workflows/build-thunder-embedded.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: thunder-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: 迅雷网盘内置登录自动上传工具
          path: thunder-electron/dist/*.exe
