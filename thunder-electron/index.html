<!doctype html><meta charset="utf-8"><title>迅雷网盘自动上传工具</title><style>body{margin:0;font-family:Microsoft YaHei}#top{height:290px;border-bottom:1px solid #aaa}#bar{padding:10px;background:#f5f5f5}input{width:500px;padding:6px;margin:3px}button{padding:7px 15px;margin:4px}.log{height:170px;overflow:auto;background:#111;color:#0f0;padding:8px;white-space:pre-wrap}#web{width:100%;height:100%}</style><div id="top"><webview id="web" src="https://pan.xunlei.com" allowpopups></webview></div><div id="bar">目标文件夹 ID <input id="parent" placeholder="根目录可留空"><br>本地文件 <input id="file" readonly><button id="choose">选择文件</button><button id="up">开始自动上传</button><progress id="p" value="0" max="100" style="width:400px"></progress></div><div class="log" id="log"></div><script>const $=id=>document.getElementById(id); $('choose').onclick=async()=>{let f=await api.chooseFile();if(f)$('file').value=f};$('up').onclick=async()=>{try{if(!$('file').value)return alert('请选择文件');await api.upload({file:$('file').value,parent:$('parent').value});alert('上传完成')}catch(e){alert(e.message)}};api.onLog(m=>{$('log').textContent+=m+'\n';$('log').scrollTop=99999});api.onProgress(x=>{$('p').value=x.done*100/x.total});</script>
